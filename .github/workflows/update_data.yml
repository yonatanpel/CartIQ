name: Update CartIQ Supermarket Data

on:
  schedule:
    # מריץ את הסקריפט כל יום בשעה 03:00 בלילה (שעון UTC)
    - cron: '0 3 * * *'
  workflow_dispatch: # מאפשר לך להריץ את זה גם ידנית בלחיצת כפתור בגיטהאב

jobs:
  update-database:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas
        # במידה ונוסיף ספריות scraping נוסיף אותן לכאן

    - name: Run Data Fetcher
      run: python fetch_prices.py

    - name: Commit and push updated database
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add data/cartiq.db
        # מתעד רק אם היו באמת שינויים במסד הנתונים
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update prices database" && git push)
