name: Update CartIQ Supermarket Data

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-database:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ensure data directory exists
      run: mkdir -p data

    - name: Run Data Fetcher
      run: python fetch_prices.py

    - name: Commit and push updated database
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add data/cartiq.db
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update prices database" && git push)
